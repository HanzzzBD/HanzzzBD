<style>@font-face{font-family:'Anton';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Rajdhani';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
.t{font-family:'Cinzel',Georgia,serif;font-weight:900}
.d{font-family:'Anton',Impact,'Arial Narrow',sans-serif}
.h6{font-family:'Rajdhani','Arial Narrow',sans-serif;font-weight:600}
.h7{font-family:'Rajdhani','Arial Narrow',sans-serif;font-weight:700}
.m{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-weight:500}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.look{transform-origin:30px 30px;animation:look 4s ease-in-out infinite}
@keyframes look{0%,40%,100%{transform:translateX(0)}50%,60%{transform:translateX(-3px)}70%,80%{transform:translateX(3px)}}

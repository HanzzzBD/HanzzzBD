<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="img" aria-label="Land of Dawn: gold lane, mid lane, exp lane, jungle, roam, lord, turtle, base">
<style>@font-face{font-family:'Rajdhani';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}.t{font-family:'Cinzel',Georgia,serif;font-weight:900}
.d{font-family:'Anton',Impact,'Arial Narrow',sans-serif}
.h6{font-family:'Rajdhani','Arial Narrow',sans-serif;font-weight:600}
.h7{font-family:'Rajdhani','Arial Narrow',sans-serif;font-weight:700}
.m{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-weight:500}
.dm{transform-origin:600px 14px;animation:dm 2.4s ease-in-out infinite}@keyframes dm{50%{transform:scale(.6)}}
.ticker{animation:ticker 60s linear infinite}@keyframes ticker{to{transform:translateX(-1400px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".12" stop-color="#fff"/><stop offset=".88" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="m"><rect x="20" y="0" width="510" height="28" fill="url(#fadeL)"/><rect x="670" y="0" width="510" height="28" fill="url(#fadeL)"/></mask>
</defs>
<g mask="url(#m)"><g class="ticker"><text class="h6" x="0" y="18" font-size="11" letter-spacing="4" textLength="1400" lengthAdjust="spacing" fill="#8ea8d9">LAND OF DAWN  ·  GOLD LANE  ·  MID LANE  ·  EXP LANE  ·  JUNGLE  ·  ROAM  ·  LORD  ·  TURTLE  ·  BASE  ·  </text><text class="h6" x="1400" y="18" font-size="11" letter-spacing="4" textLength="1400" lengthAdjust="spacing" fill="#8ea8d9">LAND OF DAWN  ·  GOLD LANE  ·  MID LANE  ·  EXP LANE  ·  JUNGLE  ·  ROAM  ·  LORD  ·  TURTLE  ·  BASE  ·  </text></g></g>
<path d="M540 14H574M626 14H660" stroke="#f6c453" stroke-width="2"/>

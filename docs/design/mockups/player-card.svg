<svg xmlns="http://www.w3.org/2000/svg" width="400" height="244" viewBox="0 0 410 250" role="img" aria-labelledby="t d">
  <title id="t">Player card (sample data)</title>
  <desc id="d">SamplePlayer, title Rookie of the Realms, level 13 with 3,250 of 4,500 EXP to level 14, rank Paragon II with 3 of 5 stars, 2,340 Battle Points, 12-day streak, main hero Syntaria the Typed Arcanist.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131B30"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#C9962F"/><stop offset="1" stop-color="#F3D98E"/></linearGradient>
    <style>
      .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .h{font-weight:700;letter-spacing:.06em}
    </style>
  </defs>
  <rect x="1" y="1" width="408" height="248" rx="14" fill="url(#bg)" stroke="#E0B54E" stroke-opacity=".55"/>
  <path d="M14 1h40M356 1h40M1 14v30M409 14v30" stroke="#E0B54E" stroke-width="2" stroke-linecap="round"/>
  <!-- avatar -->
  <circle cx="62" cy="70" r="38" fill="#1B2542" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="62" cy="70" r="31" fill="#26324F"/>
  <text x="62" y="78" text-anchor="middle" class="f h" font-size="22" fill="#AEB8CE">SP</text>
  <!-- identity -->
  <text x="116" y="52" class="f h" font-size="20" fill="#E9EDF6">SamplePlayer</text>
  <text x="116" y="72" class="f" font-size="13" fill="#B9A6E8">✎ Rookie of the Realms</text>
  <text x="116" y="94" class="f" font-size="12" fill="#8792AB">✔ Player since 2022 · Σ Level 13</text>
  <!-- level -->
  <g transform="translate(24 124)">
    <rect width="54" height="26" rx="6" fill="#1B2542" stroke="#E0B54E"/>
    <text x="27" y="18" text-anchor="middle" class="f h" font-size="14" fill="#F3D98E">LV 13</text>
    <rect x="66" y="8" width="296" height="10" rx="5" fill="#1B2542"/>
    <rect x="66" y="8" width="214" height="10" rx="5" fill="url(#gold)"/>
    <text x="362" y="40" text-anchor="end" class="f" font-size="12" fill="#AEB8CE">3,250 / 4,500 EXP to LV 14</text>
  </g>
  <!-- stat row -->
  <g transform="translate(24 182)" class="f">
    <rect width="114" height="50" rx="8" fill="#1B2542"/>
    <text x="12" y="20" font-size="11" fill="#8792AB">RANK</text>
    <text x="12" y="40" font-size="15" font-weight="700" fill="#A47CF0">Paragon II</text>
    <rect x="124" width="114" height="50" rx="8" fill="#1B2542"/>
    <text x="136" y="20" font-size="11" fill="#8792AB">BATTLE POINTS</text>
    <text x="136" y="40" font-size="15" font-weight="700" fill="#E0B54E">2,340</text>
    <rect x="248" width="114" height="50" rx="8" fill="#1B2542"/>
    <text x="260" y="20" font-size="11" fill="#8792AB">STREAK</text>
    <text x="260" y="40" font-size="15" font-weight="700" fill="#4FD1C5">12 days</text>
  </g>
  <text x="386" y="30" text-anchor="end" class="f" font-size="10" fill="#8792AB" letter-spacing=".15em">SAMPLE DATA</text>
</svg>
